<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Only this site's own files: the videos, posters and captions are
       served from lightable.dev itself. No scripts. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>Lightable demo: what changed between two drawing revisions</title>
  <meta name="description" content="A short demo of Lightable: compare two revisions of a DXF drawing and see every change in plain words, not just the clouded one. Free, open source, runs in your browser.">
  <link rel="canonical" href="https://lightable.dev/demo/">
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Lightable demo: what changed between two drawing revisions">
  <meta property="og:description" content="The revision cloud marks one change. Lightable finds ten. Free, open source, runs in your browser.">
  <meta property="og:url" content="https://lightable.dev/demo/">
  <meta property="og:image" content="https://lightable.dev/demo/poster-landscape.jpg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta property="og:video" content="https://lightable.dev/demo/demo-landscape.mp4">
  <meta property="og:video:type" content="video/mp4">
  <meta property="og:video:width" content="1920">
  <meta property="og:video:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #161616; color: #ddd; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 4px 0 12px; }
    p { margin: 8px 0; color: #bbb; }
    video { display: block; width: 100%; height: auto; border-radius: 8px; background: #000; }
    /* Vertical on phones held upright, landscape everywhere else. */
    .vertical { display: none; max-height: 82vh; width: auto; max-width: 100%; margin: 0 auto; }
    @media (orientation: portrait) and (max-width: 700px) {
      .vertical { display: block; }
      .landscape { display: none; }
    }
    .try { display: inline-block; margin: 16px 0 8px; padding: 12px 20px; border-radius: 8px;
           background: #4cb0ff; color: #0b1a26; font-weight: 600; text-decoration: none; font-size: 18px; }
    .try:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .small { font-size: 14px; color: #999; }
  </style>
</head>
<body>
  <main>
    <h1>The revision cloud marks one change. Lightable finds ten.</h1>
    <video class="landscape" controls playsinline muted preload="metadata" poster="poster-landscape.jpg"
           width="1920" height="1080">
      <source src="demo-landscape.mp4" type="video/mp4">
      <track kind="captions" src="demo.vtt" srclang="en" label="English">
    </video>
    <video class="vertical" controls playsinline muted preload="metadata" poster="poster-vertical.jpg"
           width="1080" height="1920">
      <source src="demo-vertical.mp4" type="video/mp4">
      <track kind="captions" src="demo.vtt" srclang="en" label="English">
    </video>
    <a class="try" href="../">Try it yourself</a>
    <p>Compare two revisions of a DXF drawing and see every change in plain words. Free and open source.</p>
    <p class="small">Lightable runs in your browser: the files you open are read there and never uploaded.</p>
  </main>
</body>
</html>
